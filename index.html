<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Stop + Think 1.1.8</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 1em;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    body.slides-mode {
      font-size: 1.4em;
    }
    body.slides-mode textarea,
    body.slides-mode .answer-box,
    body.slides-mode #answer-box summary span {
      font-size: 1.2em;
    }
    .question-box, textarea, .answer-box {
      width: 90vw;
      max-width: 600px;
    }
    textarea {
      margin-top: 1em;
      height: 50px;
      font-size: 1em;
    }
    .answer {
      color: green;
      font-size: 0.9em;
    }
    .navigation {
      margin-top: 0.25em;
      margin-bottom: 0.75em;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5em;
      justify-content: center;
    }
    @media (max-width: 480px) {
      .navigation {
        flex-direction: column;
        align-items: center;
      }
    }
    button {
      padding: 0.3em 0.75em;
      font-size: 0.85em;
      border: 1px solid #bbb;
      background: #f8f8f8;
      color: #444;
      border-radius: 4px;
      cursor: pointer;
    }
    @media (min-width: 768px) {
      .navigation {
        flex-direction: row;
        flex-wrap: wrap;
      }
    }
    .question-box {
      font-size: 1rem;
    }
    .slides-mode .question-box {
      font-size: 1.5rem;
    }
    .answer-box {
      border: thin solid #F1F3F4;
      width: 90vw;
      max-width: 600px;
    }
    .answer-box button {
      padding: 0.4em 0.8em;
      font-size: 0.9em;
      cursor: pointer;
    }
    #version-tag {
      position: fixed;
      top: 5px;
      right: 10px;
      font-size: 0.75em;
      color: #999;
      background: #f1f1f1;
      padding: 2px 6px;
      border-radius: 4px;
      z-index: 1000;
      pointer-events: none;
    }
    img {
      display: block;
      margin-left: auto;
      margin-right: auto;
      max-width: 100%;
      height: auto;
    }
    #inline-answers {
      width: 90vw;
      max-width: 600px;
      margin-top: 2em;
    }
    #inline-answers h3 {
      color: #444;
      font-size: 1em;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.75em;
    }
    .answer-card {
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 0.75em 1em;
      margin-bottom: 1em;
      background: #fafafa;
    }
    .card-meta {
      font-size: 0.75em;
      color: #888;
      margin-bottom: 0.4em;
      display: flex;
      gap: 0.75em;
      flex-wrap: wrap;
      align-items: center;
    }
    .deck-tag {
      background: #e8f0fe;
      color: #3c4ead;
      border-radius: 3px;
      padding: 1px 6px;
      font-weight: 600;
    }
    .card-question {
      font-size: 0.95em;
      font-weight: 600;
      color: #333;
      margin-bottom: 0.6em;
    }
    .card-section-label {
      font-size: 0.75em;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.2em;
    }
    .card-student-label { color: #ba372a; }
    .card-model-label   { color: #377437; }
    .card-student-answer {
      font-size: 0.9em;
      color: #333;
      white-space: pre-wrap;
      margin-bottom: 0.75em;
      padding: 0.4em 0.6em;
      background: #fff;
      border-left: 3px solid #ba372a;
    }
    .card-model-answer {
      font-size: 0.9em;
      color: #377437;
      white-space: pre-wrap;
      padding: 0.4em 0.6em;
      background: #fff;
      border-left: 3px solid #377437;
    }
    .export-buttons {
      display: flex;
      gap: 0.5em;
      margin-bottom: 1em;
      flex-wrap: wrap;
    }
  </style>
  <script src="stdata.js"></script>
</head>
<body>
  <div id="version-tag">v1.1.8</div>
  <div class="navigation" id="nav"></div>
  <div class="question-box" id="question-box"></div>
  <textarea id="response-box" placeholder="Type your response here..."></textarea>

  <details id="answer-box" class="answer-box">
    <summary style="cursor: pointer; color: #565858; margin-bottom: 10px;">
      <span style="font-size: 10pt;">Compare your response</span>
    </summary>
    <div class="answer-box">
      <p class="answer" id="answer-text"><span></span></p>
    </div>
  </details>
  <div id="debug" style="color: #40aa40; font-size: 0.9em; margin-top: 0.5em;"></div>

  <script>
    // --- Query param helpers ---

    function getQueryParam(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    function getQuestionSequence() {
      const qList = getQueryParam("q");
      return qList ? qList.split(",").map(n => parseInt(n.trim(), 10)) : [];
    }

    function getCurrentIndex() {
      const index = getQueryParam("i");
      return index ? parseInt(index, 10) : 0;
    }

    function getDebug() {
      return getQueryParam("debug") === 'yes';
    }

    function isPreReadMode() {
      return getQueryParam("preRead") === 'true';
    }

    function isSlidesMode() {
      const sv = getQueryParam("slides");
      return !!sv && sv !== 'false';
    }

    function getDeckName() {
      const sv = getQueryParam("slides");
      if (!sv || sv === 'false') return null;
      return (sv === 'true') ? 'unknown' : sv;
    }

    function getDeckId() {
      return getQueryParam("deck") || "default";
    }

    // --- Storage helpers ---

    function loadEntry(key) {
      const raw = localStorage.getItem(key);
      if (!raw) return { answer: "", deck: "unknown", updated: null };
      try {
        const parsed = JSON.parse(raw);
        if (typeof parsed === "object" && parsed !== null) return parsed;
        return { answer: String(parsed), deck: "unknown", updated: null };
      } catch {
        return { answer: raw, deck: "unknown", updated: null };
      }
    }

    function saveEntry(key, answerText) {
      localStorage.setItem(key, JSON.stringify({
        answer:  answerText,
        deck:    getDeckId(),
        updated: Date.now()
      }));
    }

    // --- Formatting helpers ---

    function formatDate(ms) {
      if (!ms) return "unknown date";
      return new Date(ms).toLocaleString(undefined, {
        month: "short", day: "numeric", year: "numeric",
        hour: "numeric", minute: "2-digit"
      });
    }

    function answersAsText(entries) {
      const bar = "─".repeat(40);
      return entries.map(e =>
        `[${e.deck}  ·  ${formatDate(e.updated)}]\n` +
        `Q${e.num}: ${e.question}\n\n` +
        `You: ${e.myAnswer}\n\n` +
        `Model: ${e.modelAnswer}`
      ).join(`\n\n${bar}\n\n`);
    }

    // --- Data collection ---

    function collectAllAnswers() {
      return Object.keys(localStorage)
        .filter(k => /^stopthink_q_\d+$/.test(k))
        .sort((a, b) => {
          const n = k => parseInt(k.replace("stopthink_q_", ""));
          return n(a) - n(b);
        })
        .map(key => {
          const num    = parseInt(key.replace("stopthink_q_", ""));
          const card   = window.stopThinkQuestions.find(q => q.number === num);
          const stored = loadEntry(key);
          return {
            num,
            question:    card   ? card.question : `Question ${num}`,
            modelAnswer: card   ? card.answer   : "(model answer unavailable)",
            myAnswer:    stored.answer  || "(no response)",
            deck:        stored.deck    || "unknown",
            updated:     stored.updated || null
          };
        });
    }

    // --- Render ---

    function renderQuestion() {
      const sequence = getQuestionSequence();
      const currentIndex = getCurrentIndex();
      const debug = getDebug();
      if (debug) document.getElementById("debug").innerText = sequence;

      const qNum = sequence[currentIndex];
      if (isSlidesMode()) {
        document.body.classList.add("slides-mode");
      }

      const entry = window.stopThinkQuestions.find(q => q.number === qNum);

      const questionBox = document.getElementById("question-box");
      const answerBox   = document.getElementById("answer-box");
      const answerText  = document.getElementById("answer-text");
      const responseBox = document.getElementById("response-box");

      if (!entry) {
        questionBox.innerHTML = `<strong>Question not found. Check your q list.</strong>`;
        answerBox.style.display = "none";
        return;
      }

      const key   = `stopthink_q_${entry.number}`;
      const saved = loadEntry(key).answer;

      const preRead = isPreReadMode();

      const promptHTML = preRead
        ? `<strong><span style="color: #377437;">PONDER THIS</span>: </strong>`
        : `<strong><span style="color: #ba372a;">STOP</span>
            <span style="color: #565858ff;">+</span>
            <span style="color: #377437ff;">THINK</span>: </strong>`;

      questionBox.innerHTML = `
        <strong><span class="question-text">
          ${promptHTML} ${entry.question} (${entry.number})
        </span></strong>`;

      answerText.innerHTML = preRead ? "Read the reading!" : entry.answer;

      responseBox.value = saved;

      responseBox.addEventListener("input", () => {
        saveEntry(key, responseBox.value);
        if (responseBox.value.trim().length >= 14) {
          document.getElementById("debug").innerText = "";
        }
      });

      renderNav(sequence, currentIndex);
    }

    function renderNav(sequence, index) {
      const nav = document.getElementById("nav");
      nav.innerHTML = "";

      const nextIndex = (index + 1) % sequence.length;

      const nextBtn = document.createElement("button");
      nextBtn.textContent = "→" + `Q${nextIndex + 1}/${sequence.length}`;
      nextBtn.onclick = () => {
        const base   = window.location.pathname;
        const params = new URLSearchParams();
        params.set("q", sequence.join(","));
        params.set("i", nextIndex);
        ["preRead", "debug", "slides", "deck"].forEach(p => {
          const v = getQueryParam(p);
          if (v) params.set(p, v);
        });
        window.location.href = `${base}?${params.toString()}`;
      };
      nav.appendChild(nextBtn);

      const showBtn = document.createElement("button");
      showBtn.textContent = "Export Answers";
      showBtn.onclick = showAnswersInline;
      nav.appendChild(showBtn);
    }

    // --- Export ---

    function downloadAnswers() {
      const text = answersAsText(collectAllAnswers());
      const blob = new Blob([text], { type: "text/plain" });
      const a    = document.createElement("a");
      a.href     = URL.createObjectURL(blob);
      a.download = "stop-think-answers.txt";
      a.click();
    }

    function fallbackCopyText(text) {
      const temp = document.createElement("textarea");
      temp.value = text;
      temp.setAttribute("readonly", "");
      temp.style.position = "absolute";
      temp.style.left = "-9999px";
      document.body.appendChild(temp);
      temp.select();
      const success = document.execCommand("copy");
      document.body.removeChild(temp);
      return success;
    }

    function generateMarkdown() {
      const entries = collectAllAnswers();
      let md = "";
      entries.forEach(e => {
        const tmp    = document.createElement("div");
        tmp.innerHTML = e.question;
        const plainQ  = (tmp.textContent || "").trim();
        md += `## Q${e.num}: ${plainQ}`;
        if (e.updated) md += `\n*[${e.deck}  ·  ${formatDate(e.updated)}]*`;
        md += `\n\n${e.myAnswer}\n\n---\n\n`;
      });
      return md;
    }

    function showAnswersInline() {
      const entries = collectAllAnswers();

      // Rebuild fresh each time so updated answers appear immediately
      const existing = document.getElementById("inline-answers");
      if (existing) existing.remove();

      const outputDiv = document.createElement("div");
      outputDiv.id = "inline-answers";

      const heading = document.createElement("h3");
      heading.textContent = "Your Answers";
      outputDiv.appendChild(heading);

      // Button row
      const btnContainer = document.createElement("div");
      btnContainer.className = "export-buttons";

      const copyTextBtn = document.createElement("button");
      copyTextBtn.textContent = "Copy as Text";
      copyTextBtn.onclick = () => {
        const text = answersAsText(entries);
        navigator.clipboard.writeText(text)
          .then(() => { copyTextBtn.textContent = "Copied!"; })
          .catch(() => {
            const ok = fallbackCopyText(text);
            copyTextBtn.textContent = ok ? "Copied!" : "Copy failed";
          });
        setTimeout(() => copyTextBtn.textContent = "Copy as Text", 1500);
      };

      const downloadBtn = document.createElement("button");
      downloadBtn.textContent = "Download .txt";
      downloadBtn.onclick = downloadAnswers;

      const mdBtn = document.createElement("button");
      mdBtn.textContent = "Copy as Markdown";
      mdBtn.onclick = () => {
        const md = generateMarkdown();
        navigator.clipboard.writeText(md)
          .then(() => { mdBtn.textContent = "Copied!"; })
          .catch(() => {
            const ok = fallbackCopyText(md);
            mdBtn.textContent = ok ? "Copied!" : "Copy failed";
          });
        setTimeout(() => mdBtn.textContent = "Copy as Markdown", 1500);
      };

      btnContainer.appendChild(copyTextBtn);
      btnContainer.appendChild(downloadBtn);
      btnContainer.appendChild(mdBtn);
      outputDiv.appendChild(btnContainer);

      // Cards
      if (entries.length === 0) {
        const empty = document.createElement("p");
        empty.style.color = "#888";
        empty.textContent = "No answers saved yet.";
        outputDiv.appendChild(empty);
      } else {
        entries.forEach(e => {
          const card = document.createElement("div");
          card.className = "answer-card";

          const meta = document.createElement("div");
          meta.className = "card-meta";
          const deckTag = document.createElement("span");
          deckTag.className = "deck-tag";
          deckTag.textContent = e.deck;
          const timeSpan = document.createElement("span");
          timeSpan.textContent = formatDate(e.updated);
          meta.appendChild(deckTag);
          meta.appendChild(timeSpan);

          const questionDiv = document.createElement("div");
          questionDiv.className = "card-question";
          questionDiv.innerHTML = `Q${e.num}: ${e.question}`;

          const studentLabel = document.createElement("div");
          studentLabel.className = "card-section-label card-student-label";
          studentLabel.textContent = "You";

          const studentAnswer = document.createElement("div");
          studentAnswer.className = "card-student-answer";
          studentAnswer.textContent = e.myAnswer;

          const modelLabel = document.createElement("div");
          modelLabel.className = "card-section-label card-model-label";
          modelLabel.textContent = "Model";

          const modelAnswer = document.createElement("div");
          modelAnswer.className = "card-model-answer";
          modelAnswer.innerHTML = e.modelAnswer;

          card.appendChild(meta);
          card.appendChild(questionDiv);
          card.appendChild(studentLabel);
          card.appendChild(studentAnswer);
          card.appendChild(modelLabel);
          card.appendChild(modelAnswer);
          outputDiv.appendChild(card);
        });
      }

      document.body.appendChild(outputDiv);
    }

    document.querySelector("#answer-box summary").addEventListener("click", (event) => {
      if (isSlidesMode()) return;
      console.log('Got past slides mode restriction');
      const response = document.getElementById("response-box").value;
      if (response.trim().length < 14) {
        event.preventDefault();
        document.getElementById("debug").innerText = "At least type \"I have no idea\" if you want to view a suggested response.\".";
      }
    });

    window.addEventListener("load", renderQuestion);
  </script>

</body>
</html>
